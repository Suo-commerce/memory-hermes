#
# WHICH KEYS ACTUALLY DO ANYTHING (verified against Hermes v2026.7.1)
#
#   Read by plugins/memory/__init__.py (the memory discovery path):
#       description        — shown in `hermes memory list`
#     ...and nothing else. The provider NAME comes from the directory name,
#     not from `name` below.
#
#   Read by hermes_cli/plugins.py (the general PluginManager, which handles
