#          long the file header happens to be, which is not a property anyone
#          would think to preserve while editing a comment block. Declaring
#          kind explicitly skips the scan entirely. (Valid kinds: standalone,
#          backend, exclusive, platform, model-provider.)
#   NEW  — `pip_dependencies`. Read by hermes_cli/memory_setup.py:99 and
