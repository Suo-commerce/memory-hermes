# Generation Timestamp: 2026-07-30T20:00:00Z
#
# pyproject.toml
# v2.4.0 CHANGES (SPEC-NAMESPACE-001):
#   FIX  — version bumped 2.2.0 -> 2.4.0 to match plugin.yaml and __init__.py.
#          Namespace support is a significant feature addition.
#
# v2.2.0 CHANGES:
#   FIX — `[tool.setuptools.py-modules]` was declared as a string
#         (`rerank_server = "rerank_server"`). Setuptools requires an array,
#         and rejects the file before doing anything else:
#             ValueError: invalid pyproject.toml config: `tool.setuptools.py-modules`
#         This file has never built. `pip install astral-memory-hermes`, which
#         the README advertises, could not have worked.
#   FIX — Removed `[project.scripts] astral-rerank-server = "rerank_server:main"`
#         and the `py-modules` stanza entirely. Both referenced rerank_server.py,
#         which does not exist in this repository. Declaring a module that isn't
#         there is what broke the wheel. If the sidecar is vendored later, add
#         both back in the same commit that adds the file — not before.
#   FIX — requires-python raised to ">=3.11,<3.14" to match Hermes Agent's own
#         constraint. We previously advertised 3.10, on which Hermes cannot run.
#         A user on 3.10 got a working pip install and a host that would not
#         start: the same class of silent incompatibility as the v2.1.0 outage.
#   FIX — Replaced `packages.find` (which cannot discover a hyphenated
#         directory) with an explicit `packages` list plus `package-dir`.
#   NEW — `dev` extra: the contract guard's dependencies, so
#         `pip install -e .[dev]` is enough to run tests/.
#   NEW — Classifiers reflect the supported Python range and Beta -> Production.
#
# ON THE HERMES DEPENDENCY
#   `hermes-agent` is deliberately NOT a runtime dependency. This package is
#   installed into a Hermes source tree, not resolved alongside it, and pinning
#   it here would fight the host's own resolver. Compatibility is enforced
#   where it can actually be enforced: at import time (the hard
#   `from agent.memory_provider import MemoryProvider`), at registration
#   (`_assert_contract`), and in CI (tests/test_provider_contract.py against a
#   pinned checkout).

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-memory-hermes"
version = "2.4.0"
description = "Offline-first persistent memory provider for Hermes Agent. Surprise-gated learning, local embeddings, cross-encoder reranking, HyDE query expansion, session diary, fleet sync. No API keys required."
readme = "README.md"
license = { text = "MIT" }

# Matches hermes-agent's own `requires-python = ">=3.11,<3.14"`.
# Do not widen this without checking what Hermes supports.
requires-python = ">=3.11,<3.14"

authors = [
    { name = "Suocommerce", email = "support@suocommerce.fi" },
]
keywords = [
    "hermes-agent", "memory", "memory-provider", "ai-memory", "offline",
    "local-embeddings", "persistent-memory", "surprise-gating",
    "astral-core", "llm-memory", "fleet-sync", "cross-encoder",
    "reranking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
# Dependencies for the MiniLM cross-encoder sidecar.
# NOTE: this installs the libraries the sidecar needs. It does not install a
# sidecar — rerank_server.py is not currently shipped in this repository.
# See the header note above.
reranker = [
    "sentence-transformers>=2.2.0",
    "flask>=2.3.0",
]

# Everything needed to run tests/test_provider_contract.py.
# Hermes itself is not listed: the guard expects it on PYTHONPATH from a
# pinned checkout. See CONTRIBUTING in the README.
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Suo-commerce/memory-hermes"
Documentation = "https://github.com/Suo-commerce/memory-hermes#readme"
Repository = "https://github.com/Suo-commerce/memory-hermes"
Issues = "https://github.com/Suo-commerce/memory-hermes/issues"
"Memory Server" = "https://orbitalfortress.com"
"OpenClaw Plugin" = "https://github.com/Suo-commerce/memory-openclaw"

# Aspirational: Hermes discovers memory providers from
# plugins/memory/<name>/ inside its own tree, not via pip entry points.
# Harmless to declare; will work automatically if upstream adds pip discovery.
[project.entry-points."hermes_agent.memory_providers"]
astral_memory = "astral_memory"

# ---------------------------------------------------------------------------
# Packaging
#
# The on-disk directory is `astral-memory/` (hyphen) because that is what the
# Hermes docs show in the source tree. Python cannot import a hyphenated name,
# so it installs as `astral_memory` (underscore). `packages.find` cannot
# discover a hyphenated directory as a package, so name it explicitly.
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = ["astral_memory"]

[tool.setuptools.package-dir]
astral_memory = "astral-memory"

[tool.setuptools.package-data]
astral_memory = ["plugin.yaml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — not a pattern we use
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
